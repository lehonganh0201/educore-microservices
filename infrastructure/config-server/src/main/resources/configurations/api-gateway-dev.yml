server:
  port: ${SERVER_PORT:8080}

spring:
  cloud:
    gateway:
      server:
        webflux:
          routes:
            - id: identify-service
              uri: lb://IDENTIFY-SERVICE
              predicates:
                - Path=/api/v1/auth/**

            - id: identify-service-accounts
              uri: lb://IDENTIFY-SERVICE
              predicates:
                - Path=/api/v1/accounts/**

          discovery:
            locator:
              enabled: true
              lower-case-service-id: true

eureka:
  instance:
    prefer-ip-address: ${EUREKA_PREFER_IP_ADDRESS:false}

  client:
    register-with-eureka: true
    fetch-registry: true

    service-url:
      defaultZone: ${EUREKA_SERVER_URL:http://localhost:8761/eureka/}

management:
  endpoints:
    web:
      exposure:
        include: health,info,gateway,prometheus

  endpoint:
    gateway:
      access: read-only

    health:
      show-details: ${HEALTH_SHOW_DETAILS:never}