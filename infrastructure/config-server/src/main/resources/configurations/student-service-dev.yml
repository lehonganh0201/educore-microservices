server:
  port: ${SERVER_PORT:8082}

spring:
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/student_db}
    username: ${DB_USERNAME:lehonganh}
    password: ${DB_PASSWORD:lehonganh}

  jpa:
    open-in-view: false

    hibernate:
      ddl-auto: validate

    properties:
      hibernate:
        format_sql: true
        jdbc:
          time_zone: UTC

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true

  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${KEYCLOAK_ISSUER_URI:http://localhost:9090/realms/educore}

eureka:
  instance:
    prefer-ip-address: ${EUREKA_PREFER_IP_ADDRESS:false}

  client:
    register-with-eureka: true
    fetch-registry: true

    service-url:
      defaultZone: ${EUREKA_SERVER_URL:http://localhost:8761/eureka/}

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus

  endpoint:
    health:
      show-details: ${HEALTH_SHOW_DETAILS:never}

  metrics:
    tags:
      # Tự động gắn nhãn "application" chứa tên ứng dụng vào mọi metrics được tạo ra
      application: ${spring.application.name}